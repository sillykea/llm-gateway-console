name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Type-check the web app
        working-directory: web
        run: npm run typecheck
      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Unit tests
        run: go test -race -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1

      - name: Build the console
        run: CGO_ENABLED=0 go build -o bin/console ./cmd/console
      - name: Build the gateway it manages
        run: GOBIN="$PWD/bin" go install github.com/sillykea/llm-gateway/cmd/gateway@main
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests (console + real gateway)
        working-directory: web
        env:
          GATEWAY_BIN: ${{ github.workspace }}/bin/gateway
        run: npm run e2e

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/sillykea/llm-gateway-console:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
